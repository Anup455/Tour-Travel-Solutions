name: Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Build React frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tour-travel-frontend/package-lock.json
      - name: Install dependencies
        working-directory: tour-travel-frontend
        run: npm ci
      - name: Check dependency advisories
        working-directory: tour-travel-frontend
        run: npm audit --audit-level=moderate
      - name: Build frontend
        working-directory: tour-travel-frontend
        run: npm run build

  backend:
    name: Check PHP syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP endpoints
        run: find tour-travel-backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l
